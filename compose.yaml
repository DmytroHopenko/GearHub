name: gearhub

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gearhub
      POSTGRES_USER: gearhub
      POSTGRES_PASSWORD: gearhub_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postges_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearhub -d gearhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postges_data: